# Option A: one EC2 server runs the API and PostgreSQL in Docker.
#
# The server copies this file to /opt/cloudart and runs it with the settings file generated by Terraform (/cloudart/prod/env in SSM).
# deploy/server/deploy.sh does all of this; see docs/deployment-log.md. To run it by hand on the server:
#   cd /opt/cloudart && docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# Only the API is reachable from outside (port 80, and only from CloudFront); PostgreSQL has no published port.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /data/postgres:/var/lib/postgresql/data   # the separate EBS data disk, mounted at /data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    image: ${API_IMAGE}                              # built ON THE SERVER by deploy/server/deploy.sh (no registry; see the deployment log, R4)
    pull_policy: never                               # never try to download it: it only exists locally
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.prod
    ports:
      - "80:4000"
    logging:                                         # to CloudWatch Logs through the server's IAM role
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${LOG_GROUP}
        # No fixed stream name: each container gets its own stream (named from this tag). A shared name made the
        # short-lived migrate/seed containers and the running API collide and the API's lines were lost (error E12).
        tag: "{{.Name}}-{{.ID}}"
